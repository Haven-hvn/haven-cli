[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "haven-cli"
version = "0.1.0"
description = "Event-driven data pipeline CLI for media archival and processing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["cli", "pipeline", "media", "archival", "filecoin", "encryption"]
authors = [
    { name = "Haven Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving",
]
dependencies = [
    "typer==0.27.2",
    "rich==15.0.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "apscheduler==3.11.3",
    "croniter==6.2.4",
    "aiofiles==25.1.0",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "scipy==1.18.1; python_version >= '3.12'",
    "scipy==1.17.1; python_version < '3.12'",
    "ImageHash==4.3.2",
    "SQLAlchemy==2.1.1",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "unidecode==1.4.0",
    "python-dotenv==1.2.3",
    "livekit==1.1.20",
    "psutil==7.2.2",
    "av==18.1.0",
    "python-multipart==0.0.32",
    "arkiv-sdk==1.0.0b3.dev0",
    "yt-dlp==2026.8.19",
    "libtorrent==2.1.1; python_version < '3.14'",
    "libtorrent @ file:///root/haven-cli/wheels/libtorrent-2.0.11-cp314-cp314-linux_x86_64.whl ; python_version == '3.14' and platform_system == 'Linux' and platform_machine == 'x86_64'",
    "requests==2.34.2",
    "beautifulsoup4==4.15.0",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
media = [
    "python-magic==0.4.27",
]
vlm = [
    "vlm-engine==1.0.1",
    # Latest allowed by vlm-engine (via multiplexer-llm, requires openai==2.15.0).
    "openai==2.15.0",
    "google-generativeai==0.8.6",
]
blockchain = [
    # Latest allowed by arkiv-sdk (requires web3>=7.13.0,<7.14.0).
    "web3==7.13.0",
]
icp = [
    "vetkd_py==0.1.0",
    "icp-py-core==2.3.1",
]
tui = [
    "textual==8.2.8",
    "plotille==6.0.5",
    "tomli==2.4.1",
]
all = [
    "haven-cli[media,vlm,blockchain,icp,tui]",
]
dev = [
    "icp-py-core==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "mypy==2.3.1",
    "ruff==0.16.9",
    "types-Pillow==10.2.0.20240822",
    "respx==0.23.1",
]

[project.scripts]
haven = "haven_cli.main:app"
haven-tui = "haven_tui.app:main"

[project.urls]
Documentation = "https://github.com/haven/haven-cli#readme"
Issues = "https://github.com/haven/haven-cli/issues"
Source = "https://github.com/haven/haven-cli"

[tool.hatch.build.targets.wheel]
packages = ["haven_cli", "haven_tui"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "C4", "SIM"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
