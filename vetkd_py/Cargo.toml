[package]
name = "vetkd_py"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "VetKD transport-key unwrap and IBE decrypt for Haven-AOL (Python bindings via PyO3)"
license = "MIT"

[lib]
name = "vetkd_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
ic-vetkeys = "=0.9.0"
# VetKDKeyId / VetKDCurve must match ic-vetkeys 0.9.0, which pulls
# ic-management-canister-types 0.7.1 via ic-cdk-management-canister 0.1.1.
ic-management-canister-types = "=0.7.1"
# Pinned at latest 0.8.x: ic-vetkeys 0.9.0 requires rand ^0.8.5, so rand 0.9+/0.10
# would fail to compile (IbeSeed::random takes a rand 0.8 Rng).
rand = "=0.8.5"
